name: Sync Mobian Rockchip Linux

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rockchip-linux
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1

      - name: Add Salsa remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://salsa.debian.org/Mobian-team/devices/kernels/rockchip-linux.git

      - name: Fetch all refs from Salsa
        run: |
          git fetch upstream --prune --tags '+refs/heads/*:refs/remotes/upstream/*'

      - name: Push all branches
        run: |
          git for-each-ref --format='%(refname)' refs/remotes/upstream/ | while read ref; do
            branch="${ref#refs/remotes/upstream/}"
            if [ "$branch" != "HEAD" ]; then
              git push origin "${ref}:refs/heads/${branch}" || true
            fi
          done

      - name: Push all tags
        run: |
          git tag --list | while read tag; do
            git push origin "refs/tags/${tag}:refs/tags/${tag}" || true
          done
